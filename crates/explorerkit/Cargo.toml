[package]
name = "explorerkit"
version = "0.1.0"
edition = "2021"
publish = false

[[test]]
name = "macos-system-configuration"
path = "tests/macos_system_configuration.rs"
required-features = ["macos-system-webview"]
harness = false

[[example]]
name = "multiple-native-views"
path = "examples/multiple-native-views/main.rs"
required-features = ["servo"]

[features]
default = []
macos-system-webview = [
    "servo",
    "dep:block2",
    "dep:mime",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-foundation",
    "dep:objc2-web-kit",
    "dep:serde_json",
    "dep:wry",
]
servo = [
    "dep:cocoa",
    "dep:core-foundation",
    "dep:core-video",
    "dep:dpi",
    "dep:euclid",
    "dep:gleam",
    "dep:glow",
    "dep:image",
    "dep:io-surface",
    "dep:objc2-core-foundation",
    "dep:raw-window-handle",
    "dep:servo",
    "dep:surfman",
    "dep:webrender_api",
    "explorerkit-embedder/servo",
]

[dependencies]
explorerkit-embedder = { path = "../explorerkit-embedder" }
explorerkit-host = { path = "../explorerkit-host" }

[target.'cfg(any(target_os = "android", target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
dpi = { workspace = true, optional = true }
raw-window-handle = { workspace = true, optional = true }
servo = { workspace = true, optional = true }
webrender_api = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6.2", optional = true }
cocoa = { workspace = true, optional = true }
core-foundation = { workspace = true, optional = true }
core-video = { workspace = true, optional = true }
euclid = { workspace = true, optional = true }
gleam = { workspace = true, optional = true }
glow = { workspace = true, optional = true }
image = { workspace = true, optional = true }
io-surface = { workspace = true, optional = true }
mime = { version = "0.3.17", optional = true }
objc2-core-foundation = { workspace = true, optional = true }
objc2-app-kit = { workspace = true, features = ["NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "NSGraphics", "NSColor"], optional = true }
objc2 = { workspace = true, optional = true }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSError", "NSJSONSerialization", "NSNull", "NSData", "NSString", "NSValue", "NSURL", "NSURLRequest"], optional = true }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "WKError", "WKContentWorld", "WKWebView", "WKBackForwardList", "WKBackForwardListItem", "WKUIDelegate", "WKNavigationAction", "WKWindowFeatures", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKProcessPool", "WKFrameInfo", "WKOpenPanelParameters", "WKSecurityOrigin"], optional = true }
serde_json = { version = "1", optional = true }
surfman = { workspace = true, optional = true }
wry = { workspace = true, optional = true }
