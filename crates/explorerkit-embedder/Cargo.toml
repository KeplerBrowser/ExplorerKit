[package]
name = "explorerkit-embedder"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
servo = [
    "dep:cookie",
    "dep:dpi",
    "dep:euclid",
    "dep:rustls",
    "dep:servo",
    "dep:servo-allocator",
    "dep:servo-default-resources",
]

[dependencies]
serde_json = "1"
explorerkit-host = { path = "../explorerkit-host" }
thiserror = "2.0"
url = "2.5"

[dev-dependencies]
servo-base = "=0.6.0"

[target.'cfg(target_os = "android")'.dependencies]
dpi = { workspace = true, optional = true }
euclid = { workspace = true, optional = true }
rustls = { workspace = true, optional = true, features = ["ring"] }
servo = { workspace = true, optional = true }
servo-allocator = { workspace = true, optional = true }
servo-default-resources = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
cookie = { version = "=0.18.1", optional = true }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
dpi = { workspace = true, optional = true }
euclid = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
servo = { workspace = true, optional = true }
servo-allocator = { workspace = true, optional = true }
servo-default-resources = { workspace = true, optional = true }
